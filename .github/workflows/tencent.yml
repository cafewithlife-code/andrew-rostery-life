/* 产生一份「自包含」的唯读记录表（含本档全部 CSS，可离线打开） */
function buildStandalone(recs){
  /* ============================================================
     输出结构（依使用者指定顺序）：
     【描述性评估区块】5 个感官类别
        1. 干香气/湿香气属性评估（合并：干香属性 + 湿香属性）
        2. 风味/余韵属性评估（合并：风味属性 + 余韵属性）
        3. 酸质属性评估
        4. 口感属性评估
        5. 甜感属性评估
        每个类别呈现：强度 → 勾选项 → 笔记

     【情感性评估区块】顺序与命名参照描述性评估
        1. 干香气/湿香气（合并：干香 + 湿香）
        2. 风味/余韵（合并：风味 + 余韵）
        3. 酸质
        4. 口感
        5. 甜感
     ============================================================ */

  /* 描述性评估输出区块定义
     每个区块：{label, intensity:[{key, label}], attrs:[{key, label}], taste:[{key, label}], notes:[noteKey]} */
  const DESC_BLOCKS=[
    {label:"干香气/湿香气属性评估",
     intensity:[{k:"dry",label:"干香气"},{k:"wet",label:"湿香气"}],
     attrs:[{k:"dry",label:"干香属性"},{k:"wet",label:"湿香属性"}],
     taste:[],
     notes:["aroma_attr","aroma_emo"]},
    {label:"风味/余韵属性评估",
     intensity:[{k:"flav",label:"风味"},{k:"aft",label:"余韵"}],
     attrs:[{k:"flav",label:"风味属性"},{k:"aft",label:"余韵属性"}],
     taste:[{k:"flav",label:"风味味觉"},{k:"aft",label:"余韵味觉"}],
     notes:["flav_attr","flav_emo"]},
    {label:"酸质属性评估",
     intensity:[{k:"aci",label:"酸质"}],
     attrs:[{k:"aci",label:"酸质属性"}],
     taste:[],
     notes:["aci_desc","aci_emo"]},
    {label:"口感属性评估",
     intensity:[{k:"mf",label:"口感"}],
     attrs:[{k:"mf",label:"口感属性"}],
     taste:[],
     notes:["mf_attr","mf_emo"]},
    {label:"甜感属性评估",
     intensity:[{k:"swt",label:"甜感"}],
     attrs:[{k:"swt",label:"甜感属性"}],
     taste:[],
     notes:["swt_desc","swt_emo"]}
  ];

  /* 情感性评估输出区块定义（顺序与命名参照描述性评估） */
  const EMO_BLOCKS=[
    {label:"干香气/湿香气", scores:[{idx:0,label:"干香"},{idx:1,label:"湿香"}]},
    {label:"风味/余韵", scores:[{idx:2,label:"风味"},{idx:4,label:"余韵"}]},
    {label:"酸质", scores:[{idx:5,label:"酸质"}]},
    {label:"口感", scores:[{idx:3,label:"口感"}]},
    {label:"甜感", scores:[{idx:6,label:"甜感"}]},
    {label:"综合评估", scores:[{idx:7,label:"综合"}]}
  ];

  /* 笔记 key → 显示标题 */
  const NK={
    "aroma_attr":"干香属性笔记","aroma_emo":"湿香情感性笔记",
    "flav_attr":"风味属性笔记","flav_emo":"余韵情感性笔记",
    "aci_desc":"酸质属性笔记","aci_emo":"酸质情感性笔记",
    "swt_desc":"甜感属性笔记","swt_emo":"甜感情感性笔记",
    "mf_attr":"口感属性笔记","mf_emo":"口感情感性笔记",
    "overall":"综合评估情感性笔记"
  };

  /* 表头：基本资讯 + 描述性评估区块 + 情感性评估区块 + 汇总 */
  let thead=`<th style="text-align:left;padding-left:8px">样品</th><th>日期</th><th>填表人</th><th>烘焙</th>`;

  /* 描述性评估表头（每个区块：强度 + 勾选项 + 味觉 + 笔记） */
  const thDesc=k=>`<th style="background:#4a6a50;font-size:8.4px;max-width:160px;white-space:normal;line-height:1.35">${k}</th>`;
  DESC_BLOCKS.forEach(b=>{
    b.intensity.forEach(x=>{thead+=thDesc(x.label+"强度")});
    b.attrs.forEach(x=>{thead+=thDesc(x.label)});
    b.taste.forEach(x=>{thead+=thDesc(x.label)});
    b.notes.forEach(k=>{thead+=thDesc(NK[k])});
  });

  /* 情感性评估表头 */
  const thEmo=k=>`<th style="background:#3a5a80;font-size:8.4px;max-width:120px;white-space:normal;line-height:1.35">${k}</th>`;
  EMO_BLOCKS.forEach(b=>{
    b.scores.forEach(x=>{thead+=`<th>${b.label}</th>`});
    /* 综合评估的情感性笔记 */
    if(b.label==="综合评估"){thead+=thEmo(NK["overall"])};
  });

  thead+='<th>各项总和</th><th>情感性总分</th>';

  /* 资料列 */
  const rows=recs.map(r=>{
    const n=r.notes||{};
    const roastTxt=(r.roast>0&&ROAST_TXT&&ROAST_TXT[r.roast-1])?ROAST_TXT[r.roast-1]:"未选择";
    let tds=`<td style="text-align:left;padding-left:8px">${esc(r.cup)}</td><td>${esc(r.date)}</td><td>${esc(r.cupper)}</td><td>${roastTxt}</td>`;

    /* 描述性评估区块 */
    DESC_BLOCKS.forEach(b=>{
      /* 强度 */
      b.intensity.forEach(x=>{
        const st=(r.desc&&r.desc[x.k])||{int:0,attrs:[],taste:[]};
        tds+=`<td style="font-weight:600;color:#2a5a3a">${st.int>0?st.int:"—"}</td>`;
      });
      /* 勾选项（属性） */
      b.attrs.forEach(x=>{
        const st=(r.desc&&r.desc[x.k])||{int:0,attrs:[],taste:[]};
        const labels=(ATTR_LABELS[x.k]||[]);
        const txt=st.attrs&&st.attrs.length?st.attrs.map(i=>labels[i]).join("、"):"";
        tds+=`<td style="font-size:9.4px;color:#33414f;text-align:left;white-space:normal;word-break:break-word">${esc(txt)||"—"}</td>`;
      });
      /* 味觉 */
      b.taste.forEach(x=>{
        const st=(r.desc&&r.desc[x.k])||{int:0,attrs:[],taste:[]};
        const txt=st.taste&&st.taste.length?st.taste.map(i=>TASTE_ATTRS[i]).join("、"):"";
        tds+=`<td style="font-size:9.4px;color:#33414f;text-align:left;white-space:normal;word-break:break-word">${esc(txt)||"—"}</td>`;
      });
      /* 笔记 */
      b.notes.forEach(k=>{
        tds+=`<td style="font-size:9.4px;color:#33414f;text-align:left;white-space:normal;word-break:break-word">${esc(n[k])||"—"}</td>`;
      });
    });

    /* 情感性评估区块 */
    EMO_BLOCKS.forEach(b=>{
      b.scores.forEach(x=>{
        tds+=`<td>${r.sc[x.idx]||"—"}</td>`;
      });
      /* 综合评估的情感性笔记 */
      if(b.label==="综合评估"){
        tds+=`<td style="font-size:9.4px;color:#33414f;text-align:left;white-space:normal;word-break:break-word">${esc(n["overall"])||"—"}</td>`;
      }
    });

    tds+=`<td>${r.sum}</td><td><b>${r.total.toFixed(2)}</b></td>`;
    return `<tr>${tds}</tr>`;
  }).join('');

  return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CVA 咖啡评分记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",system-ui,sans-serif;background:#eef1f5;color:#16202c;padding:14px}
h1{font-size:19px;color:#1f3a5f;display:flex;align-items:center;gap:7px}
h1::before{content:"☕"}
.sub{font-size:11px;color:#6b7785;margin:4px 0 12px}
.card{background:#fff;border:1px solid #e2e7ed;border-radius:14px;padding:5px 11px;margin-bottom:11px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;min-width:520px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid #e2e7ed;white-space:nowrap}
th{color:#fff;font-size:9px;letter-spacing:.5px}
th.desc-block{background:#4a6a50}
th.emo-block{background:#3a5a80}
td:first-child{text-align:left;font-weight:700;color:#1f3a5f;font-size:11.5px}
.note{font-size:10.5px;color:#6b7785;line-height:1.8;background:#f7f9fb;border-radius:11px;padding:10px 12px}
.legend{font-size:10px;color:#6b7785;margin:6px 0 10px;line-height:1.7}
.legend b{color:#1f3a5f}
</style></head><body>
<h1>CVA 咖啡评分记录</h1>
<div class="sub">共 ${recs.length} 笔 · 公式：0.65625 × 各项总和 + 52.75</div>
<div class="legend">
  <b>【描述性评估】</b>干香气/湿香气属性评估 → 风味/余韵属性评估 → 酸质属性评估 → 口感属性评估 → 甜感属性评估<br>
  <b>【情感性评估】</b>干香气/湿香气 → 风味/余韵 → 酸质 → 口感 → 甜感 → 综合评估
</div>
<div class="card"><table>
<thead><tr>${thead}</tr></thead>
<tbody>${rows}</tbody></table></div>
<div class="note">本档由「CVA 咖啡评分器」另存产生，可离线用浏览器开启。iPhone 存于「档案」App，安卓存于「下载」App。</div>
</body></html>`;
}
function new_date_str(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function new_date_str(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}


/* ============ 描述性评估：清空 / 汇出 ============ */
function resetDesc(){
  if(!confirm("确定清空本页所有强度与勾选？情感性评分与记录不受影响。"))return;
  DESC_STATE={};
  try{localStorage.removeItem(DKEY)}catch(e){}
  DESC.forEach(sec=>{setInt(sec.k,0,false)});
  document.querySelectorAll('.cata input').forEach(c=>c.checked=false);
  toast("描述性评估已清空");
}
function descSummary(){
  const ATTRS={dry:AROMA_ATTRS,wet:AROMA_ATTRS,flav:FLAVOR_ATTRS,aft:FLAVOR_ATTRS,mf:MOUTHFEEL_ATTRS};
  return DESC.map(sec=>{
    const st=DESC_STATE[sec.k]||{int:0,attrs:[],taste:[]};
    const a=(st.attrs||[]).map(i=>(ATTRS[sec.k]||[])[i]).join("、");
    const t=(st.taste||[]).map(i=>TASTE_ATTRS[i]).join("、");
    return sec.zh+"："+st.int+(a?" ｜ "+a:"")+(t?" ｜ 味觉 "+t:"");
  }).join("\n");
}

/* ============ 分页 ============ */
function go(p,noSave){
  if(!noSave)saveCurrent();
  captureScroll();
  curPage=p;
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  ['desc','rec'].forEach(k=>document.getElementById('t-'+k).classList.toggle('on',k===p));
  if(p==='rec')renderRec();if(p==='desc')loadDesc();
  restoreScroll();
}
let toastTimer;
let curRec=null;
function toast(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1700)}


/* ============================================================
   启动自检清理（v3）：修复旧版「清除了但没清干净」的遗留脏数据
   - 旧版只把强度/属性归零，未清 notes，且 DESC_STATE 与 SAMPLES[i].desc 不同步
   - 任何残留的非空 notes / 非零强度 / 非空勾选，一律视为脏数据并清除
   - 仅首次运行（本机从未打开过此版本）时执行，之后自动跳过
   ============================================================ */
/* 启动自检清理（v3）：修复旧版「清除了但没清干净」的遗留脏数据
   同时清理 DKEY(cva_desc_v1 / DESC_STATE) 与 SKEY(cva_samples_v1 / SAMPLES) 两处数据源 */
(function(){
  const VKEY="cva_selfcheck_v3";
  if(localStorage.getItem(VKEY)==="1")return;
  let fixed=0;
  /* 1) 清理 SAMPLES 存档（SKEY） */
  let samples=[];
  try{const d=JSON.parse(localStorage.getItem("cva_samples_v1"));if(d&&Array.isArray(d))samples=d.slice()}catch(e){samples=[]}
  samples.forEach(function(s){
    if(!s||!s.desc)return;
    if(s.desc.notes&&Object.keys(s.desc.notes).length){s.desc.notes={};fixed+=1;}
    Object.keys(s.desc).forEach(function(k){
      if(k==="notes")return;
      const st=s.desc[k];
      if(st&&typeof st==="object"){
        if(st.int||(st.attrs&&st.attrs.length)||(st.taste&&st.taste.length)){
          s.desc[k]={int:0,attrs:[],taste:[]};fixed+=1;
        }
      }
    });
  });
  try{localStorage.setItem("cva_samples_v1",JSON.stringify(samples))}catch(e){}
  /* 2) 清理 DESC_STATE（DKEY）—— 这才是画面实际读取的数据源 */
  try{
    let desc=JSON.parse(localStorage.getItem("cva_desc_v1"));
    if(desc&&typeof desc==="object"){
      if(desc.notes&&Object.keys(desc.notes).length){desc.notes={};fixed+=1;}
      Object.keys(desc).forEach(function(k){
        if(k==="notes")return;
        const st=desc[k];
        if(st&&typeof st==="object"){
          if(st.int||(st.attrs&&st.attrs.length)||(st.taste&&st.taste.length)){
            desc[k]={int:0,attrs:[],taste:[]};fixed+=1;
          }
        }
      });
      try{localStorage.setItem("cva_desc_v1",JSON.stringify(desc))}catch(e){}
    }
  }catch(e){}
  /* 3) 标记已完成，下次打开跳过 */
  localStorage.setItem(VKEY,"1");
  if(fixed)toast("已自动清理旧版残留笔记（"+fixed+" 处），可正常使用了");
})();

/* ============================================================
   构建版本号：V + YYMMDD-HH（生成年月日＋时，24 小时制补零）
   例：2026 年 10 月 15 日 05 点 → V261015-05
   位置：标题「CVA 综合评估」右侧，小字徽章
   ------------------------------------------------------------
   ⚠ 每次重新生成/交付时，只需修改下方 BUILD 字符串即可，
   V 标签会自动解析并渲染，无需改其他任何地方。
   ============================================================ */
(function(){try{
  const BUILD="2026-10-15T05:00:00+08:00";
  const d=new Date(BUILD);
  const p=n=>String(n).padStart(2,"0");
  const tag="V"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours());
  const el=document.getElementById("buildVer");
  if(el)el.textContent=tag;
}catch(e){}})();

SAMPLES=loadSamples();buildList();loadSample(SID);
  if(SAMPLES[SID]&&SAMPLES[SID].cupper){window.__CUPER__=SAMPLES[SID].cupper;document.getElementById('cupper').value=SAMPLES[SID].cupper;}
document.body.classList.add('with-list');
calc();renderRec();
/* 初次载入：若有记忆位置就回到上次停留处 */
restoreScroll();
</script>
