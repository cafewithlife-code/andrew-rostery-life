/* 情感性评估子区块的显示标题（与描述性评估对齐；不更动 ITEMS 定义与记录表列名） */
function emoHTML(i){
  const it=EMO_TITLE[i]||ITEMS[i];
  let btns="";
  for(let n=1;n<=9;n++)btns+=`<button id="b${i}_${n}" onclick="pick(${i},${n})">${n}</button>`;
  return `<div class="emo">
    <div class="name"><div class="zh">${it[0]}</div><div class="en">${it[1]}</div></div>
    <div class="scroller"><div class="pick">${btns}</div></div>
  </div>`;
}
function setInt(k,v,live){
  const n=Math.max(0,Math.min(15,Math.round(parseFloat(v)||0)));
  if(!DESC_STATE[k])DESC_STATE[k]={int:0,attrs:[],taste:[]};
  DESC_STATE[k].int=n;
  const el=document.querySelector('.int input[data-sec="'+k+'"]');
  if(el){el.value=n;el.closest('.rail').style.setProperty('--fill',(n/15*100)+'%');}
  const ve=document.getElementById('dv_'+k);
  if(ve){ve.textContent=String(n);ve.classList.toggle('zero',n===0)}
  if(live)saveDesc();
}
function stepInt(k,dir){
  const cur=(DESC_STATE[k]&&DESC_STATE[k].int)||0;
  const n=Math.max(0,Math.min(15,cur+dir*1));
  setInt(k,n,true);toast(n?"强度 "+n+" ｜ 点数值可 ±1 微调":"强度已归零");
}
/* 配对共用栏位：一次勾选同步写入两个区段 */
function togglePaired(pair,t,i,el){
  pair.split(',').forEach(k=>{
    if(!DESC_STATE[k])DESC_STATE[k]={int:0,attrs:[],taste:[]};
    const key=t==="1"?"taste":"attrs";
    const arr=(DESC_STATE[k][key]||[]).slice();
    const idx=arr.indexOf(i);
    if(el.checked){if(idx<0)arr.push(i)}else{if(idx>=0)arr.splice(idx,1)}
    DESC_STATE[k][key]=arr.sort((a,b)=>a-b);
  });
  saveDesc();
  const names=pair.split(',').map(k=>DESC.find(d=>d.k===k).zh).join('、');
  toast(el.checked?"已套用至 "+names:"已取消 "+names);
}
function saveDesc(){try{localStorage.setItem(DKEY,JSON.stringify(DESC_STATE))}catch(e){}
  if(curRec){const rec=records.find(r=>r.id===curRec);if(rec)rec.desc=JSON.parse(JSON.stringify(DESC_STATE));}
  autosave()}
/* 口感独立勾选 */
function toggleMf(k,i,el){
  if(!DESC_STATE[k])DESC_STATE[k]={int:0,attrs:[],taste:[]};
  const arr=(DESC_STATE[k].attrs||[]).slice();
  const idx=arr.indexOf(i);
  if(el.checked){if(idx<0)arr.push(i)}else{if(idx>=0)arr.splice(idx,1)}
  DESC_STATE[k].attrs=arr.sort((a,b)=>a-b);
  saveDesc();toast(el.checked?"已勾选 "+MOUTHFEEL_ATTRS[i]:"已取消 "+MOUTHFEEL_ATTRS[i]);
}
document.addEventListener('change',e=>{
  const c=e.target.closest('.cata input[type=checkbox]');if(!c)return;
  if(c.dataset.paired)togglePaired(c.dataset.paired,c.dataset.t,+c.dataset.i,c);
  else if(c.dataset.sec)toggleMf(c.dataset.sec,+c.dataset.i,c);
});
/* 切换样品时，把 DESC_STATE 的快照回填到滑杆 / 勾选框 / 笔记 UI */
function applyDescUI(){
  DESC.forEach(sec=>{
    const st=DESC_STATE[sec.k]||{int:0,attrs:[],taste:[]};
    /* 1) 强度滑杆 + 数值方块 + 填充条 */
    const el=document.querySelector('.int input[data-sec="'+sec.k+'"]');
    if(el){el.value=st.int||0;el.closest('.rail').style.setProperty('--fill',((st.int||0)/15*100)+'%');}
    const ve=document.getElementById('dv_'+sec.k);
    if(ve){ve.textContent=String(st.int||0);ve.classList.toggle('zero',(st.int||0)===0);}
  });
  /* 2) 共用属性 / 味觉勾选框（干湿、风味余韵）：data-paired 值为 "a,b"，需逐一比对 */
  document.querySelectorAll('.cata[data-paired]').forEach(c=>{
    const [a,b]=c.dataset.paired.split(',');
    const primary=(PAIRED.find(p=>p.a===a&&p.b===b)||{}).primary||b;
    const st=DESC_STATE[primary]||{attrs:[],taste:[]};
    const list=c.dataset.t==="1"?st.taste:st.attrs;
    c.checked=(list||[]).includes(+c.dataset.i);
  });
  /* 3) 口感独立勾选框 */
  (MOUTHFEEL_ATTRS||[]).forEach((_,j)=>{
    const el=document.querySelector('.cata input[data-sec="mf"][data-t="0"][data-i="'+j+'"]');
    if(el)el.checked=((DESC_STATE.mf&&DESC_STATE.mf.attrs)||[]).indexOf(j)>=0;
  });
}
function loadDesc(){
  try{const d=JSON.parse(localStorage.getItem(DKEY));if(d&&typeof d==="object")DESC_STATE=d}catch(e){DESC_STATE={}}
  DESC.forEach(sec=>{
    const st=DESC_STATE[sec.k]||{int:0,attrs:[],taste:[]};
    setInt(sec.k,st.int||0,false);
    const el=document.querySelector('.int input[data-sec="'+sec.k+'"]');
    if(el)el.closest('.rail').style.setProperty('--fill',((st.int||0)/15*100)+'%');
  });
  /* 共用勾选回填：以 primary 区段的快照为准 */
  document.querySelectorAll('.cata[data-paired]').forEach(c=>{
    const [a,b]=c.dataset.paired.split(',');
    const primary=(PAIRED.find(p=>p.a===a&&p.b===b)||{}).primary||b;
    const st=DESC_STATE[primary]||{attrs:[],taste:[]};
    const list=c.dataset.t==="1"?st.taste:st.attrs;
    c.checked=list.includes(+c.dataset.i);
  });
  (MOUTHFEEL_ATTRS||[]).forEach((_,j)=>{
    const el=document.querySelector('.cata input[data-sec="mf"][data-t="0"][data-i="'+j+'"]');
    if(el)el.checked=((DESC_STATE.mf&&DESC_STATE.mf.attrs)||[]).indexOf(j)>=0;
  });
  fillNotes(DESC_STATE.notes||{});
}

function scores(){return STATE.map(v=>{const n=parseInt(v,10);return(isNaN(n)||n<1||n>9)?0:n})}
function calc(){
  const sc=scores();
  const sum=sc.reduce((a,b)=>a+b,0);
  const total=sum>0?Math.round((0.65625*sum+52.75)*100)/100:0;
  document.getElementById('score').innerHTML=total.toFixed(2)+'<u>分</u>';
  document.getElementById('cnt').textContent=sc.filter(x=>x>0).length;
  document.getElementById('bar').style.width=Math.min(100,total)+'%';
  const v=document.getElementById('verdict');
  if(!sum)v.textContent="尚未评分";
  else if(total>=90)v.textContent="卓越 Exceptional";
  else if(total>=85)v.textContent="优秀 Outstanding";
  else if(total>=80)v.textContent="良好 Very Good";
  else if(total>=75)v.textContent="尚可 Good";
  else v.textContent="待加强 Fair";
  return{sc,sum,total};
}
function pick(i,v){
  STATE[i]=STATE[i]===v?"":v;
  for(let n=1;n<=9;n++)document.getElementById(`b${i}_${n}`).classList.toggle('on',STATE[i]==n);
  calc();
}
/* 烘焙程度：1–6 档位，无数值显示 */
const ROAST_TXT=['极浅','浅','浅中','中','中深','深'];
/* 烘焙程度：可切换、可取消（checkbox toggle） */
/* 烘焙程度：checkbox toggle，可选可取（单选互斥 + 再按一次取消）
   状态由 SAMPLES[SID].roast 决定：0 = 未选择，1–6 = 对应档位 */
/* 烘焙程度：checkbox toggle，可选可取（单选互斥 + 再按一次取消）
   状态由 SAMPLES[SID].roast 决定：0 = 未选择，1–6 = 对应档位
   注：label 点击时浏览器会先把 checkbox 翻转再触发 click，因此以「目标 checkbox
   是否已勾」作判断依据（el.checked 即为点击后的新状态） */
function toggleRoast(v,el){
  const n=Math.max(1,Math.min(6,Math.round(parseFloat(v)||5)));
  /* 判断「这次点击是否为『选取』」：
     - label 点击：浏览器先把 checkbox 翻转，el.checked 为新状态 → el.checked===true 表示选取
     - 直接点击 checkbox：同上
     因此 el.checked 即为「点击后的目标状态」，可直接判定。 */
  if(el.checked){
    /* 选取该档位（单选互斥） */
    SAMPLES[SID].roast=n;
    document.querySelectorAll('.roast-pick input[type=checkbox]').forEach(c=>c.checked=false);
    el.checked=true;   /* 清完后再把目标勾回来，确保视觉高亮 */
    document.getElementById('roastNow').innerHTML='目前：<b>'+ROAST_TXT[n-1]+'</b>　（'+n+' / 6）';
    if(window.__roastSync!==false)toast('烘焙程度：'+ROAST_TXT[n-1]);
  }else{
    /* 取消选择 */
    SAMPLES[SID].roast=0;
    document.getElementById('roastNow').innerHTML='目前：<b>未选择</b>　（0 / 6）';
    if(window.__roastSync!==false)toast('已取消烘焙程度选择');
  }
  persist();
}
/* 供「样品切换 / 载入」回填勾选状态用（不触发 toast） */
function applyRoastUI(){
  const n=SAMPLES[SID].roast||0;
  document.querySelectorAll('.roast-pick input[type=checkbox]').forEach(c=>c.checked=false);
  if(n>0){
    const el=document.querySelector('.roast-pick input[value="'+n+'"]');
    if(el)el.checked=true;
  }
  const now=document.getElementById('roastNow');
  if(now)now.innerHTML=n>0?'目前：<b>'+ROAST_TXT[n-1]+'</b>　（'+n+' / 6）':'目前：<b>未选择</b>　（0 / 6）';
}
function setRoast(v,sync){
  const n=Math.max(0,Math.min(6,Math.round(parseFloat(v)||0)));
  SAMPLES[SID].roast=n;   /* 同步到样品 */
  applyRoastUI();
  if(sync===true&&n>0){toast('烘焙程度：'+ROAST_TXT[n-1]);}
  const cur=records.find(r=>r.id===curRec);if(cur)cur.roast=n;
  autosave();
}

/* 输入即时自动存本机 */
function autosave(){localStorage.setItem(KEY,JSON.stringify(records))}


/* ============ 多样品管理 ============ */
const SKEY="cva_samples_v1";
let SAMPLES=[],SID=0,PENDING=null;
/* 空白描述性评估模板：新增样品时一律用这份干净的骨架，
   绝不可拷贝 DESC_STATE，否则会把当前页已填内容带进新样品。 */
function blankDesc(){
  const d={int:0,attrs:[],taste:[],notes:{}};
  DESC.forEach(sec=>{d[sec.k]={int:0,attrs:[],taste:[]};});
  return d;
}
function defaultSample(i){return{name:"",date:"",cupper:"",roast:0,sc:STATE.slice(),desc:blankDesc()}}
function loadSamples(){
  try{const d=JSON.parse(localStorage.getItem(SKEY));if(d&&Array.isArray(d)&&d.length)return d}catch(e){}
  return Array.from({length:3},(_,i)=>defaultSample(i));
}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(SAMPLES))}catch(e){}}
function applySetup(){
  saveCurrent();
  const n=parseInt(document.getElementById('setupN').value,10);
  if(!(n>=1&&n<=24)){document.getElementById('setupErr').style.display='block';return}
  const cur=SAMPLES[SID]||{};
  DESC_STATE=blankDesc();          /* 新增样品前清空编辑态，避免脏数据带入 */
  const keep=SAMPLES.slice(0,Math.min(n,SAMPLES.length));
  while(keep.length<n)keep.push(defaultSample(keep.length));
  SAMPLES=keep;SID=Math.min(SID,SAMPLES.length-1);
  persist();buildList();loadSample(SID);closeSetup();
  toast("已设定 "+n+" 个样品");
}
function openSetup(){document.getElementById('setupN').value=SAMPLES.length;document.getElementById('setupErr').style.display='none';document.getElementById('mask').classList.add('on')}
function closeSetup(){document.getElementById('mask').classList.remove('on')}
function buildList(){
  const box=document.getElementById('slist');const cur=document.getElementById('scur');
  box.innerHTML='<div class="lbl">样品</div>'+SAMPLES.map((s,i)=>{
    const nm=(s.name||'样品 '+(i+1)).trim();
    const short=nm.length>4?nm.slice(0,4)+'…':nm;
    const done=s.sc&&s.sc.some(v=>v!=="");
    return `<button class="sbtn ${i===SID?'cur':''} ${done?'done':''}" data-i="${i}" onclick="switchS(${i})"><b>${i+1}</b><span>${short}</span></button>`;
  }).join('')+
  `<button class="sbtn add" onclick="openSetup()" title="设定样品数量">＋</button>`+
  `<button class="sbtn set" onclick="openSetup()"><span>设定</span></button>`;
  if(cur)cur.textContent=(SID+1)+' / '+SAMPLES.length;
}
/* ============ 卷动位置记忆（每个样品 × 每个分页各自独立） ============
   切换样品 / 分页时，先把「当前样品 + 当前分页」的 scrollY 存起来，
   切换完成后再回到该样品该分页上次停留的位置，避免每次都跳回顶端。
   同时写入 sessionStorage，重新整理页面也不会遗失。 */
const SCROLL_KEY="cva_scrollmem_v1";
const scrollMem={};
(function loadScrollMem(){
  try{const d=JSON.parse(sessionStorage.getItem(SCROLL_KEY));
    if(d&&typeof d==="object"&&!Array.isArray(d))Object.assign(scrollMem,d);}catch(e){}
})();
/* 目前所在分页：'desc'（评分/描述）或 'rec'（记录），由 tabbar 决定 */
let curPage='desc';
function scrollKey(){return SID+':'+curPage}
/* 抓取当前位置并存到记忆体 + sessionStorage */
function captureScroll(){
  const k=scrollKey();
  /* 以视觉上真正的滚动容器为准：行动装置多是 document，
     若 body / documentElement 被程式锁定则改取 .wrap 的 scrollTop */
  const y=(document.documentElement&&document.documentElement.scrollTop)||document.body.scrollTop||0;
  const alt=document.querySelector('.wrap')||{};
  const ay=alt.scrollTop||0;
  scrollMem[k]=(y>ay?y:ay)||0;
  try{sessionStorage.setItem(SCROLL_KEY,JSON.stringify(scrollMem))}catch(e){}
}
/* 还原位置；setTimeout 是为了等待 display:block 的页面真正上版 */
let restoreTimer=null;
function restoreScroll(){
  const k=scrollKey();
  const y=scrollMem[k]||0;
  /* 先清掉待处理的还原，避免多次切换互相干扰 */
  clearTimeout(restoreTimer);
  const apply=()=>{window.scrollTo(0,y);
    const alt=document.querySelector('.wrap');if(alt&&y>0)alt.scrollTop=y;};
  apply();
  /* 有些浏览器在 display 切换后会异步重排，因此再补两次 */
  restoreTimer=setTimeout(apply,0);
  setTimeout(apply,60);
}
/* 清除某个样品（或全部）的记忆，样品被删除时呼叫 */
function forgetScroll(i){
  const ks=Object.keys(scrollMem);
  ks.forEach(k=>{if(i===undefined||k.split(':')[0]===String(i))delete scrollMem[k];});
  try{sessionStorage.setItem(SCROLL_KEY,JSON.stringify(scrollMem))}catch(e){}
}

function switchS(i){
  if(i===SID)return;
  captureScroll();
  saveCurrent();SID=i;buildList();loadSample(i);
  restoreScroll();toast("切换到样品 "+(i+1));
}
function saveCurrent(){
  if(!SAMPLES[SID])return;
  const{sc}=calc(false);
  /* 存档前先采集笔记，确保未失焦的输入也被记录 */
  DESC_STATE.notes=readNotes();
  const _cupperVal=document.getElementById('cupper').value.trim();
  window.__CUPER__=_cupperVal;
  SAMPLES.forEach(s=>{if(s&&s.cupper!==undefined)s.cupper=_cupperVal;});
  SAMPLES[SID]={name:document.getElementById('sample').value.trim(),
    date:document.getElementById('cupped').value,
    cupper:_cupperVal,
    roast:(()=>{const r=document.querySelector('.roast-pick input:checked');return r?+r.value:0;})(),
    sc:sc.slice(),desc:JSON.parse(JSON.stringify(DESC_STATE))};
  persist();
}
function loadSample(i){
  const s=SAMPLES[i];if(!s)return;
  document.getElementById('sample').value=s.name||"";
  document.getElementById('cupped').value=s.date||"";
  document.getElementById('cupper').value=window.__CUPER__||s.cupper||"";
  if(!s.date)document.getElementById('cupped').valueAsDate=new Date();
  window.__roastSync=false;applyRoastUI();window.__roastSync=true;
  STATE.fill("");s.sc.forEach((v,j)=>pick(j,v));
  if(s.desc){DESC_STATE=JSON.parse(JSON.stringify(s.desc));applyDescUI();}
  else{DESC_STATE={int:0,attrs:[],taste:[]};
    DESC.forEach(sec=>DESC_STATE[sec.k]={int:0,attrs:[],taste:[]});
    applyDescUI();}
  fillNotes((s.desc&&s.desc.notes)||(DESC_STATE.notes)||{});
  calc();buildList();
}
/* ============ 存档 / 重设 ============ */
function resetAll(){
  if(!confirm("确定清空本次 8 项评分？已存的记录不受影响。"))return;
  STATE.fill("");
  document.querySelectorAll('.pick button').forEach(b=>b.classList.remove('on'));
  calc();toast("已清空，可重新评分");
}
function saveRec(){
  const{sc,sum,total}=calc();
  if(!sum){toast("请先完成至少一项情感性评分");return}
  if(!document.getElementById('sample').value.trim()){toast("请先填写样品名称");return}
  if(!document.getElementById('cupped').value){toast("请先填写杯测日期");return}
  saveCurrent();
  toast("样品 "+(SID+1)+" 已存档 · "+total.toFixed(2)+" 分");
}
function delRec(i,e){e.stopPropagation();
  if(!confirm("确定删除「"+(SAMPLES[i].name||"样品 "+(i+1))+"」的评分？此动作无法复原。"))return;
  SAMPLES.splice(i,1);if(!SAMPLES.length)SAMPLES.push(defaultSample(0));
  forgetScroll(i);
  SID=Math.min(SID,SAMPLES.length-1);persist();buildList();loadSample(SID);renderRec();
  toast("已删除该样品评分")}
function loadRec(i){switchS(i);go('desc');toast("已载入："+(SAMPLES[i].name||"样品 "+(i+1)))}
function dint(r,i){
  const d=r.desc;if(!d)return "—";
  const st=(d&&typeof d==="object"&&!Array.isArray(d))?d[DESC[i]&&DESC[i].k]:null;
  const n=st&&st.int>0?st.int:0;
  return n||"—";
}
function renderRec(){
  const empty=document.getElementById('recempty'),tbl=document.getElementById('rectbl'),tb=document.getElementById('rectb');
  document.getElementById('reccnt').textContent=SAMPLES.length+" 个样品";
  if(!SAMPLES.length){empty.style.display='block';tbl.style.display='none';return}
  empty.style.display='none';tbl.style.display='table';
  const NK=["aroma_attr","aroma_emo","flav_attr","flav_emo","aci_desc","aci_emo","swt_desc","swt_emo","mf_attr","mf_emo","overall"];
  const NTXT=x=>`<td class="nt">${esc(x)||""}</td>`;
  tb.innerHTML=SAMPLES.map((s,i)=>{const r=toRec(s,i);
    const tag=r.total>=85?'style="color:#2f7a4d"':(r.total<75?'style="color:#c8602a"':'');
    const cur=i===SID?' style="background:rgba(192,154,90,.13)"':'';
    const n=r.notes||{};
    /* 评分列 sc 顺序：0干香 1湿香 2风味 3厚度 4余韵 5酸质 6甜感 7综合 */
    const sc=r.sc.map(x=>`<td>${x||"—"}</td>`).join('');
    const noteTd=k=>`<td class="nt">${esc(n[k])||""}</td>`;
    return `<tr${cur} onclick="switchS(${i})"><td class="cupcell">${r.cup}</td>
      <td style="font-size:10.5px;color:var(--sub)">${r.date}</td><td style="font-size:10.5px;color:var(--sub)">${r.cupper}</td><td class="sc" ${tag}>${r.total.toFixed(2)}</td>
      ${sc[0]}${noteTd("aroma_attr")}${sc[1]}${noteTd("aroma_emo")}
      ${sc[2]}${noteTd("flav_attr")}${sc[4]}${noteTd("flav_emo")}
      ${sc[5]}${noteTd("aci_desc")}${noteTd("aci_emo")}
      ${sc[6]}${noteTd("swt_desc")}${noteTd("swt_emo")}
      ${sc[3]}${noteTd("mf_attr")}${noteTd("mf_emo")}
      ${sc[7]}${noteTd("overall")}
            ${DESC.map(sec=>`<td class="nt">${esc(attrsTxt(r.desc,sec.k))||""}</td>`).join("")}
      ${DESC.map(sec=>`<td class="nt">${esc(tasteTxt(r.desc,sec.k))||""}</td>`).join("")}
      <td style="font-size:10.5px;color:var(--sub)">${(s.roast>0?ROAST_TXT[s.roast-1]:'未选择')}</td><td style="font-size:10.5px;color:var(--sub)">${r.sum}</td>
      <td class="del" onclick="delRec(${i},event)">✕</td></tr>`;
  }).join('');
}
function toRec(s,i){
  const sc=s.sc||STATE.slice();
  const sum=sc.reduce((a,b)=>a+(+b||0),0);
  const total=sum>0?0.65625*sum+52.75:0;
  return {id:i,cup:(s.name||"样品 "+(i+1))+"　#"+(i+1),date:s.date||"—",cupper:s.cupper||"—",
    total,sum,sc,desc:s.desc,notes:(s.desc&&s.desc.notes)||{},roast:s.roast>0?s.roast:0};
}

/* ============ 另存新档：产生独立 HTML（安卓 / iPhone 都能打开） ============ */
function buildCVAHeader(){
  const H=[];
  /* 基础栏位 */
  H.push("填表人员","杯测日期","杯测编号","样品名称","烘焙程度");
  /* 大区块一：描述性评估 */
  H.push("【描述性评估】");
  H.push("（一）干香气/湿香气 描述性评估","干香气强度","湿香气强度","干香气/湿香气 属性","香气属性笔记");
  H.push("（二）风味/余韵 描述性评估","风味强度","余韵强度","风味/余韵属性","风味/余韵味觉","风味/余韵属性笔记");
  H.push("（三）酸质描述性评估","酸质强度","酸质属性笔记");
  H.push("（四）甜感描述性评估","甜感强度","甜感属性笔记");
  H.push("（五）口感描述性评估","口感强度","口感属性","口感属性笔记");
  /* 大区块二：情感性评估 */
  H.push("【情感性评估】");
  H.push("香气情感性笔记","干香 Dry Aroma","湿香 Wet Aroma");
  H.push("风味/余韵情感性笔记","风味 Flavor","余韵 Aftertaste");
  H.push("酸质情感性笔记","酸质 Acidity");
  H.push("甜感情感性笔记","甜感 Sweetness");
  H.push("口感情感性笔记","口感 Mouthfeel");
  H.push("综合评估情感性笔记","综合评估 Overall","各项总和","总分");
  return H;
}
/* 单一样品 → 一行（依 buildCVAHeader 顺序） */
function toCVARow(s,i){
  const r=toRec(s,i); const d=r.desc||{}; const n=r.notes||{};
  const L=[];
  L.push(r.cupper, r.date, "样品"+(i+1)+" #"+(i+1), s.name||"", (s.roast>0?ROAST_TXT[s.roast-1]:"未选择"));
  /* 描述性评估 */
  L.push("");
  L.push("");
  L.push(d.dry&&d.dry.int||"", d.wet&&d.wet.int||"", attrsTxt(d,"wet")||"", n.aroma_attr||"");
  L.push("");
  L.push(d.flav&&d.flav.int||"", d.aft&&d.aft.int||"", attrsTxt(d,"aft")||"", tasteTxt(d,"aft")||"", n.flav_attr||"");
  L.push("");
  L.push(d.aci&&d.aci.int||"", n.aci_desc||"");
  L.push("");
  L.push(d.swt&&d.swt.int||"", n.swt_desc||"");
  L.push("");
  L.push(d.mf&&d.mf.int||"", attrsTxt(d,"mf")||"", n.mf_attr||"");
  /* 情感性评估 */
  L.push("");
  L.push(n.aroma_emo||"", r.sc[0]||"", r.sc[1]||"");
  L.push(n.flav_emo||"", r.sc[2]||"", r.sc[4]||"");
  L.push(n.aci_emo||"", r.sc[5]||"");
  L.push(n.swt_emo||"", r.sc[6]||"");
  L.push(n.mf_emo||"", r.sc[3]||"");
  L.push(n.overall||"", r.sc[7]||"", r.sum||"", r.total?r.total.toFixed(2):"");
  return L;
}

/* ============ 导出前校验：强度 / 情感评分 / 属性勾选 ============ */
/* 规则：强度未拖曳、分数未点选、区块有勾选项却一个都没勾，一律禁止输出并提醒。
   豁免项：填表人、样品名称、文字笔记、杯测日期、烘焙程度、杯测编号 */
function exportCheck(){
  const miss=[];
  /* 1) 描述性强度（7 区段，0–15 滑杆） */
  DESC.forEach(sec=>{
    const st=DESC_STATE[sec.k]||{int:0};
    if(!st.int)miss.push(sec.zh+"强度尚未设定（请拖动滑杆）");
  });
  /* 2) 情感性评分（8 项，1–9 点选） */
  const sc=scores();
  const EMO_KEYS=["dry","wet","flav","mf","aft","aci","swt","overall"];
  const EMO_NAMES=["干香","湿香","风味","口感","余韵","酸质","甜感","综合评估"];
  EMO_KEYS.forEach((k,i)=>{if(!sc[EMO_INDEX[k]])miss.push(EMO_NAMES[i]+"评分尚未点选");});
  /* 3) 属性勾选：区块有勾选项则至少勾一个 */
  if(!(DESC_STATE.dry&&DESC_STATE.dry.attrs&&DESC_STATE.dry.attrs.length)||
     !(DESC_STATE.wet&&DESC_STATE.wet.attrs&&DESC_STATE.wet.attrs.length))
    miss.push("干香气 / 湿香气属性尚未勾选（该区块至少勾选一项）");
  if(!(DESC_STATE.flav&&DESC_STATE.flav.attrs&&DESC_STATE.flav.attrs.length)||
     !(DESC_STATE.aft&&DESC_STATE.aft.attrs&&DESC_STATE.aft.attrs.length))
    miss.push("风味 / 余韵属性尚未勾选（该区块至少勾选一项）");
  if(!(DESC_STATE.mf&&DESC_STATE.mf.attrs&&DESC_STATE.mf.attrs.length))
    miss.push("口感属性尚未勾选（该区块至少勾选一项）");
  return miss;
}
/* CSV 档名：输出日期＋时间＋填表人；填表人未填则用 Cupper 代替 */
function csvBaseName(cupperVal){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  const ts=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+"_"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  const who=(cupperVal&&cupperVal.trim())?"_"+cupperVal.trim():"_Cupper";
  return ts+who;
}
function makeCsv(list){
  const rows=list.map((s,i)=>toCVARow(s,i));
  return "\ufeff"+[buildCVAHeader(),...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
}
function downloadCsv(csv,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
/* 「分享此页样品（CSV）」：仅输出当前这一页的样品 */
function exportPageCSV(){
  saveCurrent();
  const cur=SAMPLES[SID];
  if(!cur){toast("当前分页尚无样品");return}
  const miss=exportCheck();
  if(miss.length){alert("尚有以下项目未完成，无法输出：\n\n"+miss.join("\n"));return}
  const name=(cur.name&&cur.name.trim())?"样品"+(SID+1)+"_"+cur.name.trim():"样品"+(SID+1);
  downloadCsv(makeCsv([cur],"CVA综合评估_"+name+"_"+csvBaseName(cur.cupper)+".csv"));
  toast("已输出当前样品 CSV（"+SAMPLES.length+" 个样品中第 "+(SID+1)+" 个）");
}
/* 「分享全部样品（CSV）」：全部样品合并成一份 CSV */
function shareAllCSV(){
  if(!SAMPLES.length){toast("尚无记录可汇出");return}
  saveCurrent();
  const miss=exportCheck();
  if(miss.length){alert("尚有以下项目未完成，无法输出：\n\n"+miss.join("\n"));return}
  const who=(SAMPLES[0].cupper&&SAMPLES[0].cupper.trim())?SAMPLES[0].cupper.trim():"Cupper";
  downloadCsv(makeCsv(SAMPLES,"CVA综合评估_全部样品_"+csvBaseName(who)+".csv"));
  toast("已输出全部 "+SAMPLES.length+" 个样品 CSV");
}
