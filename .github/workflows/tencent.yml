<script>
/* ============================================================
   字级手动缩放（Ａ＋／Ａ－）：5 级，0.85 / 1.00 / 1.15 / 1.30 / 1.45
   设定存到 localStorage，下次开启自动套用
   ============================================================ */
(function applyFontSize(){
  const SCALES=[0.85,1,1.15,1.3,1.45];
  let idx=1;
  try{const s=parseInt(localStorage.getItem("cva_fs_idx"),10);if(!isNaN(s)&&s>=0&&s<SCALES.length)idx=s}catch(e){}
  document.documentElement.style.setProperty('--fs-scale',SCALES[idx]);
  document.body.classList.add('fs-zoom');
  /* 把 idx 暴露给 fsStep 使用 */
  window.__fsIdx=idx;window.__fsScales=SCALES;
})();
function fsStep(dir){
  const SCALES=window.__fsScales, cur=window.__fsIdx;
  const next=Math.max(0,Math.min(SCALES.length-1,cur+dir));
  if(next===cur)return;
  window.__fsIdx=next;
  try{localStorage.setItem("cva_fs_idx",next)}catch(e){}
  document.documentElement.style.setProperty('--fs-scale',SCALES[next]);
  document.body.classList.add('fs-zoom');
  toast(next>1?"字级已放大":(next<1?"字级已缩小":"字级已还原"));
}

/* ===== 清除所有样品内容：连同历史记录一起清除（危险操作，二次确认） ===== */
/* 清除「本页」所有填写内容，但保留填表人姓名（共用） */
function clearPageKeepCupper(){
  /* 保留姓名：优先从 SAMPLES 读取（已存档的值），其次才从 DOM 读取当前输入 */
  const cu=SAMPLES[SID]&&SAMPLES[SID].cupper!==undefined?SAMPLES[SID].cupper:document.getElementById('cupper').value;
  /* 基本栏位 */
  document.getElementById('sample').value="";
  document.getElementById('cupped').value="";
  document.getElementById('cupper').value="";
  /* 烘焙程度：还原为未选择 */
  document.getElementById('roastNow').innerHTML='目前：<b>未选择</b>　（0 / 6）';
  document.querySelectorAll('.roast-pick input[type=checkbox]').forEach(c=>c.checked=false);
  SAMPLES[SID].roast=0;
  /* 情感性评分 */
  STATE.fill("");
  document.querySelectorAll('.pick button.on').forEach(b=>b.classList.remove('on'));
  /* 描述性：强度 / 勾选 / 笔记 */
  /* 描述性：强度 / 属性 / 味觉 / 笔记 —— 整段重建，避免 DESC_STATE 与 SAMPLES[i].desc 不同步 */
  DESC.forEach(sec=>{
    if(!SAMPLES[SID].desc)SAMPLES[SID].desc=JSON.parse(JSON.stringify(DESC_STATE));
    SAMPLES[SID].desc[sec.k]={int:0,attrs:[],taste:[]};
    const wrap=document.getElementById('d-'+sec.k);
    if(wrap){const r=wrap.querySelector('.rail input[type=range]');if(r)r.value=0;}
  });
  DESC_STATE={int:0,attrs:[],taste:[],notes:{}};
  DESC.forEach(sec=>DESC_STATE[sec.k]={int:0,attrs:[],taste:[]});
  /* 笔记栏：情感性（#evalcard）+ 描述性（.dsec）全部清空，并去掉 .has 高亮 */
  document.querySelectorAll('#evalcard textarea[data-note], .dsec textarea').forEach(t=>{
    t.value="";t.classList.remove('has');growNote(t);
  });
  document.querySelectorAll('.cata input[type=checkbox]').forEach(c=>c.checked=false);
  /* 恢复填表人姓名 */
  document.getElementById('cupper').value=cu;
  SAMPLES[SID].cupper=cu;
  /* 关键：同时清 DKEY（DESC_STATE 来源）与 SKEY（SAMPLES 来源），否则画面与存档不同步 */
  DESC_STATE={int:0,attrs:[],taste:[],notes:{}};
  DESC.forEach(sec=>DESC_STATE[sec.k]={int:0,attrs:[],taste:[]});
  if(!SAMPLES[SID].desc)SAMPLES[SID].desc=JSON.parse(JSON.stringify(DESC_STATE));
  SAMPLES[SID].desc={int:0,attrs:[],taste:[],notes:{}};
  DESC.forEach(sec=>SAMPLES[SID].desc[sec.k]={int:0,attrs:[],taste:[]});
  saveDesc();
  persist();
  applyDescUI(SID);
  loadDesc();
  saveCurrent();renderRec();calc();
}
/* 原有：清除所有样品内容（含填表人姓名） */
function clearEverything(force){
  if(!force){
    if(!confirm("⚠️ 确定要「全部清零」吗？\n\n这会清除【所有已存记录】以及本页评分，且无法复原。\n\n只清本页请点「✕ 清空重评」。"))return;
    /* 再二次确认，避免误触 */
    if(!confirm("最后确认：真的要删除全部 " + records.length + " 笔记录吗？"))return;
  }
  records=[];STATE.fill("");
  document.querySelectorAll('.pick button').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.cata input[type=checkbox]').forEach(c=>c.checked=false);
  document.querySelectorAll('#evalcard textarea[data-note], .dsec textarea').forEach(t=>{
    t.value="";t.classList.remove('has');growNote(t);
  });
  document.getElementById('sample').value="";
  document.getElementById('cupped').value="";
  document.getElementById('cupper').value="";
  document.getElementById('roastNow').innerHTML='目前：<b>未选择</b>';
  document.querySelectorAll('.roast-pick input[type=checkbox]').forEach(c=>c.checked=false);
  (SAMPLES||[]).forEach(s=>{s.desc={int:0,attrs:[],taste:[],notes:{}};
    DESC.forEach(sec=>{s.desc[sec.k]={int:0,attrs:[],taste:[]};});s.roast=0;});
  DESC_STATE={int:0,attrs:[],taste:[],notes:{}};
  DESC.forEach(sec=>DESC_STATE[sec.k]={int:0,attrs:[],taste:[]});
  try{localStorage.removeItem(KEY)}catch(e){}
  autosave();renderRec();
  /* 把画面上的滑杆 / 数值方块 / 填充条强制归零（currentSample 可能已不是原本那页，先备份还原） */
  const bak=SID;
  DESC.forEach(sec=>setInt(sec.k,0,false));
  applyDescUI(bak);
  /* 关键：同时清 DKEY（DESC_STATE）与 SKEY（SAMPLES），否则画面与存档不同步 */
  DESC_STATE={int:0,attrs:[],taste:[],notes:{}};
  DESC.forEach(sec=>DESC_STATE[sec.k]={int:0,attrs:[],taste:[]});
  saveDesc();
  persist();
  calc();
  toast(force?"已清除所有样品内容":"已全部清零");
}

/* ===== 系统语言自动侦测：macOS / Windows / iOS / Android 皆适用 ===== */
(function detectLang(){
  let pick="zh";
  const nav=window.navigator||{};
  const tags=[];
  if(nav.language)tags.push(nav.language);
  if(nav.languages&&nav.languages.length)Array.prototype.push.apply(tags,nav.languages);
  if(nav.userLanguage)tags.push(nav.userLanguage);
  if(nav.browserLanguage)tags.push(nav.browserLanguage);
  if(nav.systemLanguage)tags.push(nav.systemLanguage);
  const ua=(nav.userAgent||"").toLowerCase();
  const prefer=tags.join(",").toLowerCase();
  /* 简体中文地区优先判定 */
  const zhCN=/zh-(cn|hans|sg|my)|zh@cn|\bzhcn\b/;
  const explicit=/zh-(hk|tw|mo|hant)|zh@tw|\bzhtw\b|\bzhhk\b/;
  if(zhCN.test(prefer)||/\bzh-cn\b/.test(ua))pick="zhCN";
  else if(explicit.test(prefer))pick="zh";
  else if(/^zh/.test(prefer))pick="zh";
  else if(/^en/.test(prefer))pick="en";
  else if(/^(ja|ko|es|fr|de|it|pt|ru)/.test(prefer)){
    pick="en"; /* 暂以英文兜底，避免半翻译 */
  }
  /* 若使用者曾手动选过语言，以手动为准 */
  try{const saved=localStorage.getItem("cva_lang");if(saved==="zh"||saved==="zhCN"||saved==="en")pick=saved}catch(e){}
  document.documentElement.setAttribute("data-lang",pick);
  const sel=document.getElementById('langsel');
  if(sel){sel.value=pick;sel.onchange=e=>setLang(e.target.value)}
})();
/* ============ 8 项评分定义（上一笔 CVA 计算器） ============ */
const ITEMS=[
  ["干香","Dry Aroma"],["湿香","Wet Aroma"],["风味","Flavor"],["口感","Mouthfeel"],
  ["余韵","Aftertaste"],["酸表现","Acidity"],["甜感","Sweetness"],["综合评估","Overall"]
];
/* 情感评分项索引（对应 ITEMS 顺序） */
const EMO_INDEX={dry:0,wet:1,flav:2,body:3,aft:4,aci:5,swt:6,mf:3,overall:7};
/* 情感性评估子区块的显示标题（与描述性评估对齐；不更动 ITEMS 定义与记录表列名） */
const EMO_TITLE={0:["干香气","Dry Aroma"],1:["湿香气","Wet Aroma"]};


const AROMA_ATTRS=["花香","果香 / 莓果","柑橘类水果","干果","咖啡樱桃","酸 / 尖酸发酵",
                   "甜 / 香草·香草醛·黄糖","坚果 / 可可","香料","烘烤的 / 谷物","烧焦的 / 烟草",
                   "绿色 / 植物","化学","陈腐 / 泥土","木质","其他"];
const FLAVOR_ATTRS=["花香","果香 / 莓果","柑橘类水果","干果","酸 / 尖酸发酵",
                    "甜 / 香草·香草醛·黄糖","坚果 / 可可","香料","烘烤的 / 谷物","烧焦的 / 烟草",
                    "绿色 / 植物","化学","陈腐 / 泥土","木质","其他"];
const MOUTHFEEL_ATTRS=["粗糙（砂砾、粉感、沙子）","油滑的","滑顺（绒滑、丝滑、糖浆）","口腔干燥","金属感"];
const TASTE_ATTRS=["咸","酸","甜","苦","鲜味"];
/* 各区段「属性勾选」的中文名称表（供汇出 / 记录页展开使用，放在本区定义之后避免 TDZ） */
const ATTR_LABELS={dry:AROMA_ATTRS,wet:AROMA_ATTRS,flav:FLAVOR_ATTRS,aft:FLAVOR_ATTRS,mf:MOUTHFEEL_ATTRS};
function attrsTxt(d,k){const st=(d&&typeof d==="object"&&!Array.isArray(d))?d[k]:null;
  return st&&st.attrs&&st.attrs.length?(st.attrs.map(i=>(ATTR_LABELS[k]||[])[i])||[]).join("、"):"";}
function tasteTxt(d,k){const st=(d&&typeof d==="object"&&!Array.isArray(d))?d[k]:null;
  return st&&st.taste&&st.taste.length?(st.taste.map(i=>TASTE_ATTRS[i])||[]).join("、"):"";}

/* ============================================================
   描述性评估资料（SCA CVA 2024 第二版 · 参考附件中文表格）
   - 7 个区段各有独立的 0–15 强度（15 分量尺）
   - 属性用 CATA 勾选：花香/果香/酸/甜/烘烤/坚果可可/香料/植物/化学/陈腐泥土/木质/其他
   - 「主要味觉」为风味 / 余韵共用栏目
   ============================================================ */
const DESC=[
  {k:"dry",  zh:"干香气", en:"Dry Aroma"},
  {k:"wet",  zh:"湿香气", en:"Wet Aroma"},
  {k:"flav", zh:"风味",   en:"Flavor"},
  {k:"aft",  zh:"余韵",   en:"Aftertaste", hasTaste:true},
  {k:"aci",  zh:"酸质",   en:"Acidity"},
  {k:"swt",  zh:"甜感",   en:"Sweetness"},
  {k:"mf",   zh:"口感",   en:"Mouthfeel"}
];
/* 配对栏位：上为 A 区段强度、下为 B 区段强度，其后接一组两者共用的勾选框
   primary = 承载勾选结果的主区段（湿香气 / 余韵） */
const PAIRED=[
  {a:"dry", b:"wet", primary:"wet", attrs:AROMA_ATTRS,  taste:null,         emo:[0,1], zh:"干香气 / 湿香气", en:"Dry / Wet Aroma",        sub:"属性同时套用于干香气与湿香气"},
  {a:"flav",b:"aft", primary:"aft", attrs:FLAVOR_ATTRS, taste:TASTE_ATTRS,  emo:[2,4], zh:"风味 / 余韵",     en:"Flavor / Aftertaste",    sub:"属性同时套用于风味与余韵"}
];
/* 情感评分项索引（对应 ITEMS 顺序） */
const DKEY="cva_desc_v1";
let DESC_STATE={};


const KEY="cva_scores_v2";
let records=[];
try{records=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){records=[]}
const STATE=ITEMS.map(()=>"");

/* ============ 计算（上上笔：1–9 整数；上一笔：0.65625×sum+52.75） ============ */

/* ============ 笔记栏（跨刷新保存、随记录一起存档、可回填、可汇出） ============
   每个 textarea 以 data-note="key" 标识；内容存入 DESC_STATE 的 notes 物件，
   随样品一起存 localStorage / 存档 / 汇出 / 另存网页，并在切换样品时回填。 */
const NOTES=[
  {k:"aroma_attr", ph:"香气属性笔记：描述性评估勾选的香气属性，例：柑橘皮、茉莉、红糖甜香…"},
  {k:"aroma_emo",  ph:"香气情感性笔记：情感性评估中干香气／湿香气的整体气息感受，例：干净明亮、层次分明…"},
  {k:"flav_attr",  ph:"风味／余韵属性笔记：描述性评估勾选的风味属性，例：蜜渍橙皮、黑糖、可可…"},
  {k:"flav_emo",   ph:"风味／余韵情感性笔记：情感性评估中风味／余韵的整体印象，例：甜感撑起酸质、尾韵绵长…"},
  {k:"aci_desc",   ph:"酸质属性笔记：描述性评估中酸质的种类与品质，例：柑橘酸、柔顺、尖锐刺激…"},
  {k:"aci_emo",    ph:"酸质情感性笔记：情感性评估中酸质带来的感受，例：活泼讨喜、过强遮盖甜感…"},
  {k:"swt_desc",   ph:"甜感属性笔记：描述性评估中甜感的种类与来源，例：蜂蜜甜、黄糖、焦糖…"},
  {k:"swt_emo",    ph:"甜感情感性笔记：情感性评估中甜感带来的感受，例：圆润饱满、甜感偏低…"},
  {k:"mf_attr",    ph:"口感属性笔记：描述性评估勾选的口感属性，例：丝滑、粉感、口腔干燥…"},
  {k:"mf_emo",     ph:"口感情感性笔记：情感性评估中口感的整体感受，例：厚实绵密、略粗糙…"},
  {k:"overall",    ph:"综合评估情感性笔记：情感性评估中最后的整体评价与建议，例：平衡佳、适合浅焙…"}
];
function noteHTML(k,ph){
  return `<div class="notebox"><textarea data-note="${k}" rows="1" maxlength="500" placeholder="${ph}" oninput="growNote(this)" onblur="saveNote(this)"></textarea></div>`;
}
/* textarea 自动增高：1–6 行，超出后内部滚动 */
function growNote(el){
  el.style.height='26px';
  const h=Math.min(126,Math.max(26,el.scrollHeight));
  el.style.height=h+'px';
  el.style.overflowY=h>=126?'auto':'hidden';
  el.classList.toggle('has',!!el.value.trim());
}
function saveNote(el){
  const k=el.dataset.note;if(!k)return;
  const v=el.value.trim();
  if(!DESC_STATE.notes)DESC_STATE.notes={};
  if(v){DESC_STATE.notes[k]=v}else{delete DESC_STATE.notes[k]}
  saveDesc();
}
/* 切换样品时回填笔记 */
function fillNotes(notes){
  const n=notes||(DESC_STATE.notes)||{};
  document.querySelectorAll('#evalcard textarea[data-note]').forEach(el=>{
    el.value=n[el.dataset.note]||"";
    el.classList.toggle('has',!!n[el.dataset.note]);
    growNote(el);
  });
}
/* 读取目前所有笔记（存档时呼叫） */
function readNotes(){const o={};document.querySelectorAll('#evalcard textarea[data-note]').forEach(el=>{const v=el.value.trim();if(v)o[el.dataset.note]=v});return o}

/* ============ 综合评估渲染：区块化，每区块含描述性 + 情感性两个次区块 ============ */
