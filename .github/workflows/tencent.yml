<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6f5c3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CVA 综合评估</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{--bg:#f4efe6;--card:#fffdf9;--ink:#3a2f25;--sub:#8a7a67;--faint:#c9bba8;--line:#e2d8c6;--paper:#f7f3ec;
  --bean:#6f5c3f;--bean-l:#9a8463;--accent:#c8602a;--gold:#c09a5a;--ok:#3f7a4f;
  /* 字级手动缩放系数（Ａ＋／Ａ－ 控制，存 localStorage） */
  --fs-scale:1}
  html,body{height:100%}
  body{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + 56px)}
  header{background:linear-gradient(135deg,#6f5c3f,#9a8463);color:#fff;padding:12px 13px;box-shadow:0 3px 14px rgba(111,92,63,.28)}
  .headtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{font-size:17.5px;font-weight:800;letter-spacing:.7px;display:flex;align-items:center;gap:7px}
  header .ver{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.85);
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
    border-radius:7px;padding:2px 6px;margin-left:5px;letter-spacing:.5px;white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header h1::before{content:"☕";font-size:16px}
  header .sub{font-size:10.5px;opacity:.85;margin-top:2px}
  .headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:9px}
  .big{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .big u{text-decoration:none;font-size:13.5px;font-weight:600;opacity:.85;margin-left:2px}
  .verd{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;white-space:nowrap;text-align:center;line-height:1.35}
  .setbtn{font-family:inherit;font-size:10.5px;font-weight:800;color:#fff;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:5px 9px;cursor:pointer;line-height:1;flex:none}
  .setbtn:active{background:rgba(255,255,255,.35)}
  /* 顶部资讯列：日期 + 填表人，固定在标题旁 */
  .topbar{display:flex;align-items:stretch;gap:8px;margin-top:9px;flex-wrap:wrap}
  .topbar .ti{flex:1 1 130px;min-width:0;display:flex;flex-direction:column;gap:3px}
  .topbar .ti label{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.82);letter-spacing:.6px;display:flex;align-items:center;gap:4px}
  .topbar .ti label i{font-style:normal;font-size:9px;font-weight:600;color:rgba(255,255,255,.6)}
  .topbar .ti input{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.95);border:1.3px solid rgba(255,255,255,.5);border-radius:9px;
    padding:7px 9px;width:100%;box-sizing:border-box}
  .topbar .ti input::placeholder{color:#b9ad9c;font-weight:400}
  .topbar .ti input:focus{outline:none;border-color:#fff;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
  @media (max-width:430px){.topbar .ti{flex:1 1 100%}}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.3);margin-top:9px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:#e9cf9f;border-radius:6px;transition:width .4s cubic-bezier(.4,0,.2,1)}
  .wrap{padding:10px 10px 0;max-width:920px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:3px 10px;margin-bottom:10px;box-shadow:0 2px 10px rgba(111,92,63,.06)}
  .sec-t{font-size:11.5px;font-weight:800;color:var(--bean);letter-spacing:1.1px;padding:9px 2px 2px;display:flex;align-items:center;gap:6px}
  .sec-t::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--gold)}
  .row{display:flex;align-items:center;gap:9px;padding:8px 3px;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .name{flex:1 1 auto;min-width:0}.name .zh{font-size:13.5px;font-weight:700;color:var(--bean)}
  .name .en{font-size:9.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scroller{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -1px;padding:1px 0}
  .scroller::-webkit-scrollbar{display:none}
  .pick{display:flex;gap:3px}
  .pick button{width:29px;height:34px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--bean);font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .pick button.on{background:var(--bean);border-color:var(--bean);color:#fff;transform:scale(1.06);box-shadow:0 3px 7px rgba(111,92,63,.34)}
  .pick button:active{transform:scale(.92)}
  .btns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .btns button{flex:1 1 92px;padding:12px 6px;font-size:12.5px;font-weight:800;border-radius:12px;border:1.5px solid var(--bean);background:#fff;color:var(--bean);font-family:inherit;cursor:pointer;min-width:84px}
  .btns button.pri{background:var(--bean);border-color:var(--bean);color:#fff}
  .btns button.gold{border-color:var(--accent);color:var(--accent)}
  .btns button:active{transform:scale(.97)}
  .tip{text-align:center;color:var(--sub);font-size:10.5px;margin:9px 0 2px;line-height:1.75}
  /* 计算逻辑卡片：说明 → 分隔线 → 计算逻辑 → 分隔线 → 版权宣告
     紧贴上方按钮列，下方另由 #bottomSpacer 提供留白 */
  #logicCard{padding:14px 10px 10px;margin-bottom:10px}
  #logicCard .explain{padding-top:4px}
  #logicCard .cr{padding:8px 2px 2px}
  /* 卡片下方的空白卡片：高度约为 logicCard 的一半 */

  /* 空白卡片：高度约为 logicCard 的一半，作为页面底部留白
     整片改为浅色虚线框，语意与其余卡片一致；对辅助技术隐藏内容 */
  #bottomSpacer{height:60px;border:1.5px dashed var(--line);background:transparent;
    box-shadow:none;display:flex;align-items:center;justify-content:center}
  #bottomSpacer .v{font-size:10px;font-weight:700;color:var(--faint);letter-spacing:1.4px}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

  #spacerCard{min-height:clamp(74px,15vw,110px);border-style:dashed;background:transparent;box-shadow:none}
  @media (max-width:820px){#spacerCard{min-height:60px}}
  .explain{font-size:10.5px;line-height:1.8;color:var(--sub);padding:2px 2px 0}
  .logic-rule{border-top:1px dashed var(--line);margin:8px 0}
  .cr{font-size:9.5px;font-weight:600;letter-spacing:.3px;color:var(--bean);
    text-align:center;line-height:1.7;padding:0 2px}
  .tabbar{position:sticky;left:0;right:0;bottom:0;z-index:40;
    display:flex;flex-direction:column;align-items:stretch;
    background:rgba(255,253,249,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:0 0 0}
  .tabbar__btns{display:flex;padding:5px 8px 4px}
  .tabbar__btns button{flex:1;border:none;background:none;font-family:inherit;font-size:9.5px;color:var(--sub);
    display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:2px;font-weight:600}
  .tabbar__btns button i{font-size:17px;font-style:normal;line-height:1;filter:grayscale(1);opacity:.5}
  .tabbar__btns button.on{color:var(--bean)}
  .tabbar__btns button.on i{filter:none;opacity:1}
  .tabbar__cr{font-size:9px;font-weight:600;letter-spacing:.3px;color:#8a7557;
    text-align:right;line-height:1.4;padding:0 10px 5px}
  .page{display:none;animation:fade .2s ease}
  .page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(16px);z-index:60;background:rgba(58,47,37,.96);color:#fff;font-size:12.5px;font-weight:600;padding:9px 17px;border-radius:20px;opacity:0;pointer-events:none;transition:.26s;max-width:84vw;text-align:center;line-height:1.5}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ============================================================
     多样品管理：左侧固定样品列 + 设定对话框
     ============================================================ */
  body.with-list{padding-left:58px}
  .slist{position:fixed;top:0;left:0;bottom:0;width:58px;z-index:50;
    background:linear-gradient(180deg,#6f5c3f,#8d7553);
    padding:48px 0 12px;display:flex;flex-direction:column;align-items:center;gap:7px;
    overflow-y:auto;scrollbar-width:none}
  .slist::-webkit-scrollbar{display:none}
  .slist .lbl{font-size:8.5px;font-weight:800;color:rgba(255,255,255,.72);letter-spacing:1.2px;
    writing-mode:vertical-rl;text-orientation:mixed;margin-bottom:2px}
  .sbtn{width:44px;height:44px;border:none;border-radius:12px;cursor:pointer;flex:none;
    font-family:inherit;font-size:11px;font-weight:800;line-height:1.1;color:#6f5c3f;
    background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.15s;padding:3px 2px 2px}
  .sbtn>b{font-size:12.5px;font-weight:800;line-height:1;color:inherit;display:block}
  .sbtn>span{font-size:7.5px;font-weight:600;color:#9a8463;margin-top:1px;line-height:1.15;display:block;max-width:38px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sbtn:hover{transform:scale(1.06)}
  .sbtn.cur{background:var(--gold);color:#fff;box-shadow:0 4px 12px rgba(192,154,90,.55);transform:scale(1.08)}
  .sbtn.cur>span{color:rgba(255,255,255,.92)}
  .sbtn.done{background:#e9cf9f}
  .sbtn.done>span{color:#6f5c3f}
  .sbtn.add{background:rgba(255,255,255,.16);color:#fff;font-size:19px;line-height:1}
  .sbtn.set{background:rgba(255,255,255,.16);color:#fff;font-size:9.5px;font-weight:800;margin-top:auto}
  .sbtn.set small{display:none}
  .scur{position:fixed;left:0;bottom:0;width:58px;z-index:51;text-align:center;
    font-size:8.5px;font-weight:800;color:rgba(255,255,255,.85);background:rgba(0,0,0,.14);
    padding:5px 0 6px;letter-spacing:.6px}
  .mask{position:fixed;inset:0;background:rgba(40,30,20,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
  .mask.on{display:flex}
  .dlg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 15px;
    width:100%;max-width:330px;box-shadow:0 12px 34px rgba(0,0,0,.3)}
  .dlg h3{font-size:14.5px;color:var(--bean);font-weight:800;margin-bottom:3px}
  .dlg .ds{font-size:10px;color:var(--sub);line-height:1.6;margin-bottom:12px}
  .dlg label.t{font-size:10.5px;font-weight:800;color:var(--bean);letter-spacing:.5px}
  .dlg input[type=number]{font-family:inherit;font-size:16px;font-weight:800;color:var(--ink);
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);
    margin:6px 0 4px;box-sizing:border-box}
  .dlg input:focus{outline:none;border-color:var(--gold)}
  .dlg .hint{font-size:9.5px;color:var(--faint);margin-bottom:14px}
  .dlg .err{font-size:10px;color:var(--accent);font-weight:700;margin:6px 0 10px;display:none}
  .dlg .acts{display:flex;gap:8px}
  .dlg .acts button{flex:1;padding:11px 6px;border-radius:11px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;border:1.5px solid var(--bean)}
  .dlg .acts .ok{background:var(--bean);color:#fff}
  .dlg .acts .no{background:#fff;color:var(--bean)}
  @media (max-width:820px){body.with-list{padding-left:0;padding-bottom:calc(132px + 56px)}
    .tabbar{z-index:45}
    .slist{top:auto;left:0;right:0;bottom:0;width:auto;height:56px;z-index:50;flex-direction:row;
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;
      background:linear-gradient(90deg,#6f5c3f,#8d7553)}
    .slist .lbl{display:none}
    .tabbar{bottom:0}
    .sbtn{width:42px;height:40px;flex:none}
    .sbtn>span{font-size:7px}
    .scur{display:none}
    .sbtn.set,.sbtn.add{height:40px}
  }


  /* ============================================================
   CVA 描述性评估（SCA 咖啡价值评估 2024 第二版）
   - 每个区段一条 0–15 强度滑杆（input[type=range]）+ 数值显示
   - 滑杆可横向拖曳微调；点击数值可切换 1 的步距
   - 香气 / 风味属性用 CATA 勾选框，可依附件表格独立勾选
   ============================================================ */
  .desc-card{margin-top:10px}
  .desc-card .sec-t{justify-content:space-between;gap:8px}
  .desc-card .sec-t .hint{font-size:9.5px;font-weight:600;color:var(--bean-l);letter-spacing:0;white-space:nowrap}
  .dsec{margin:0 -3px;padding:11px 3px;border-bottom:1px dashed var(--line)}
  .dsec:last-child{border-bottom:none}
  .dsec .dt{display:flex;align-items:baseline;gap:6px;margin-bottom:7px;flex-wrap:wrap}
  .dsec .dt .zh{font-size:12.5px;font-weight:800;color:var(--bean)}
  .dsec .dt .en{font-size:9px;color:var(--sub);letter-spacing:.2px}
  /* 强度滑杆：0–15 共 16 阶，可拖曳 */
  .int{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .int label.int-lb{flex:1 1 auto;min-width:0;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.6px}
  .int .rail{position:relative;flex:1 1 auto;min-width:0;padding:3px 0;margin-right:2px}
  .int .rail::after{content:"";position:absolute;left:0;right:0;top:50%;height:7px;transform:translateY(-50%);
      background:repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px calc(100%/15));
      border-radius:7px;pointer-events:none;opacity:.45}
  .int input[type=range]{position:relative;z-index:2}
  .int input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;margin:0;background:transparent;cursor:pointer}
  .int input[type=range]:focus{outline:none}
  .int input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:7px;background:var(--faint)}
  .int input[type=range]::-moz-range-track{height:7px;border-radius:7px;background:var(--faint)}
  .int .rail::before{content:"";position:absolute;left:0;top:50%;height:7px;transform:translateY(-50%);
      width:var(--fill,0%);background:linear-gradient(90deg,var(--bean),var(--bean-l));
      border-radius:7px;pointer-events:none;z-index:1;transition:width .12s linear}
  .int input[type=range]::-moz-range-track{height:7px;border-radius:7px;background:var(--faint)}
  .int input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
      background:#fff;border:2.5px solid var(--bean);margin-top:-6px;box-shadow:0 2px 5px rgba(111,92,63,.3);
      transition:transform .12s}
  .int input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:#fff;
      border:2.5px solid var(--bean);box-shadow:0 2px 5px rgba(111,92,63,.3)}
  .int input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
  .int .val{width:42px;height:26px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);
      color:var(--bean);font-size:12.5px;font-weight:800;font-family:inherit;text-align:center;line-height:24px;
      cursor:pointer;flex:none;font-variant-numeric:tabular-nums}
  .int .val.zero{color:var(--faint)}
  /* 低 / 中 / 高 三段标记 */
  .int ticks{display:flex;justify-content:space-between;font-size:8px;color:var(--faint);
      letter-spacing:.4px;margin:-4px 0 6px;padding:0 calc(21px + 9px)}
  /* CATA 勾选网格：3 列，贴合附件表格栏位密度 */
  .cata{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px}
  .cata.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cata label{display:flex;align-items:center;gap:4px;font-size:9.6px;color:var(--ink);line-height:1.25;
      cursor:pointer;padding:2px 1px;min-height:0}
  .cata label input{width:12px;height:12px;accent-color:var(--bean);flex:none;margin:0;cursor:pointer}
  .cata.mf{grid-template-columns:1fr}
  .cata.mf label{font-size:10px;padding:3px 1px}
  /* ===== 综合评估区块化版面 ===== */
  .eval-card{margin-top:10px}
  .eval{margin:0 -3px 14px;padding:12px 9px 4px;border:1px solid var(--line);border-left:4px solid var(--bean);
         border-radius:13px;background:linear-gradient(180deg,#fffdf9,#fbf8f2);box-shadow:0 2px 9px rgba(111,92,63,.07)}
  .eval .big-t{font-size:clamp(13px,2.8vw,16px);color:var(--bean);letter-spacing:.6px;padding:0 2px 8px;
               border-bottom:2px solid var(--gold);margin-bottom:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .eval .big-t .en2{font-size:9px;font-weight:600;color:var(--bean-l);letter-spacing:.2px}

  /* 顶部样品资讯表单 */
  .meta{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .meta .mi{display:flex;flex-direction:column;gap:3px}
  .meta .mi.full{grid-column:1/-1}
  .meta .mi label{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.82);letter-spacing:.6px}
  .meta .mi input{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.95);border:1.3px solid rgba(255,255,255,.5);border-radius:9px;
    padding:7px 9px;width:100%;box-sizing:border-box}
  .meta .mi input::placeholder{color:#b9ad9c;font-weight:400}
  .meta .mi input:focus{outline:none;border-color:#fff;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
  /* 烘焙程度滑杆：6 档位，左浅右深，不显示数值 */
  .roast{margin-top:2px}
  .roast-pick{display:flex;gap:5px}
  .roast-pick label{flex:1;position:relative}
  .roast-pick input{position:absolute;opacity:0;width:0;height:0}
  .roast-pick span{display:block;text-align:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.82);
    padding:9px 2px 8px;border:1.5px solid rgba(255,255,255,.3);border-radius:10px;
    background:rgba(255,255,255,.07);cursor:pointer;line-height:1.35;transition:.15s;white-space:nowrap}
  .roast-pick span small{display:block;font-size:7.6px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.3px;margin-top:2px}
  .roast-pick input:checked + span{background:#e9cf9f;color:#5c4a30;border-color:#e9cf9f;
    box-shadow:0 3px 9px rgba(0,0,0,.28);transform:translateY(-1px)}
  .roast-pick input:focus-visible + span{outline:2px solid #fff;outline-offset:2px}
  .roast-now{text-align:center;font-size:10.5px;font-weight:800;color:#fff;margin-top:8px;letter-spacing:.5px}
  .roast-now b{color:#e9cf9f}
  /* 情感性评分：配对区块改为上下排列（干/湿、风味/余韵） */
  .eval .emogrid.stack{grid-template-columns:1fr}
  .eval .subsec{margin-bottom:11px}
  .eval .sub-t{font-size:10.5px;color:var(--bean-l);letter-spacing:.9px;padding:0 0 6px}
  .eval .sub-t::before{background:var(--bean-l)}
  .eval .dsec{padding:9px 2px}
  .eval .emogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 14px}
  .eval .emo{display:flex;align-items:center;gap:9px;padding:6px 3px;border-bottom:1px dashed var(--line)}
  .eval .emo:last-child{border-bottom:none}
  .eval .emo .zh{font-size:12.5px}
  .eval .emo .en{font-size:9px}  .cata.mf label .sub2{color:var(--sub);font-size:8.6px;margin-left:2px;font-weight:400}
  /* 配对共用栏位：位于两条强度条之后，视觉上与强度条区隔 */
  .dsec.pair{background:linear-gradient(180deg,#fbf7f0,#f6f1e8);border:1px solid var(--gold);border-left:4px solid var(--gold);
             border-radius:12px;padding:11px 12px;margin:6px -3px 10px;box-shadow:0 2px 8px rgba(192,154,90,.14)}
  .dsec.pair .dt{margin-bottom:8px}
  .dsec.pair .dt .zh{font-size:11.8px}
  .dsec.pair .dt .en{font-size:8.6px}
  .dsec.pair .cata{margin-top:2px}
  .dsec.pair .taste-block{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .dsec.pair .taste-t{font-size:8.6px;font-weight:800;color:var(--bean-l);letter-spacing:.8px;margin-bottom:3px}
  /* 记录页 */
  .rec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 4px}
  .rec-head .t{font-size:11.5px;font-weight:800;color:var(--bean);letter-spacing:1.1px}
  .rec-head .c{font-size:10.5px;color:var(--sub)}
  .empty{text-align:center;color:var(--faint);font-size:12px;padding:16px 0}
  table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
  th,td{padding:6px 2px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--sub);font-weight:700;font-size:9px;letter-spacing:.5px;background:var(--paper,#f7f9fb)}
  td.cupcell{font-weight:800;color:var(--bean);font-size:11.5px;text-align:left;padding-left:6px}
  td.sc{font-weight:800;font-size:12px}
  td.del{color:var(--faint);cursor:pointer;font-size:14px;user-select:none}
  
  .recbox{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -10px;padding:0 10px}
  .recbox table{min-width:clamp(900px,150vw,1400px)}
  .eq{background:var(--paper);border-radius:11px;padding:10px 12px;font-size:10.5px;color:var(--sub);line-height:1.8}
  .eq b{color:var(--bean)}
  /* ============================================================
   流体响应式（Fluid RWD）
   - 以视窗宽度连续缩放，而非只有 3~4 个固定尺寸
   - 任一宽度下字级 / 按钮 / 间距都成比例，内容永远完整不被裁切
   - 范围：手机 320px ↔ 桌机 1400px
   ============================================================ */
  html{font-size:clamp(14px,calc(14px + 2.2 * ((100vw - 320px)/1080)),20px)}
  body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}

  /* 抬头：高度随宽度平滑增长 */
  header{padding:clamp(10px,2.6vw,18px) clamp(11px,3vw,24px)}
  header h1{font-size:clamp(15.5px,3.4vw,25px);letter-spacing:clamp(.4px,.18vw,1.1px)}
  header h1::before{font-size:clamp(14px,3vw,22px)}
  header .sub{font-size:clamp(10px,2.2vw,13px);margin-top:clamp(1px,.4vw,3px)}
  .headrow{margin-top:clamp(6px,1.6vw,12px);gap:clamp(8px,2vw,16px)}
  .big{font-size:clamp(30px,7.4vw,58px)}
  .big u{font-size:clamp(11px,2.4vw,16px)}
  .verd{font-size:clamp(10.5px,2.3vw,14px);padding:clamp(3px,1vw,6px) clamp(8px,2.4vw,14px)}
  .bar{height:clamp(5px,1.1vw,9px);margin-top:clamp(7px,1.8vw,12px)}

  /* 主体宽度：窄屏贴齐、宽屏置中且留白充足 */
  .wrap{width:min(92vw,980px);margin:0 auto;padding:clamp(8px,2vw,16px) 0 0}

  /* 卡片 / 列 / 项目名称 */
  .card{border-radius:clamp(13px,2.4vw,18px);padding:clamp(2px,1vw,5px) clamp(9px,2.6vw,17px);
        margin-bottom:clamp(9px,2.2vw,15px)}
  .sec-t{font-size:clamp(11px,2.3vw,13.5px);padding:clamp(7px,1.6vw,11px) 2px 2px}
  .row{gap:clamp(7px,2.2vw,14px);padding:clamp(6px,1.4vw,11px) clamp(1px,.6vw,5px)}
  .name .zh{font-size:clamp(12.5px,2.7vw,16.5px)}
  .name .en{font-size:clamp(9px,1.9vw,11.5px);margin-top:clamp(1px,.3vw,2px)}

  /* 1–9 数字按钮：尺寸与字级同步流体缩放，永远 9 颗完整显示不换行溢出 */
  .pick{gap:clamp(2px,.55vw,4px)}
  .pick button{width:clamp(25px,6.4vw,44px);height:clamp(30px,7.4vw,50px);
               font-size:clamp(12px,3vw,19px);border-radius:clamp(7px,1.8vw,11px)}

  /* 操作钮 */
  .btns{gap:clamp(6px,1.4vw,11px);margin-bottom:12px}
  .btns button{flex:1 1 clamp(78px,19vw,190px);padding:clamp(10px,2.4vw,15px) clamp(5px,1.2vw,12px);
               font-size:clamp(11.5px,2.5vw,14.5px);border-radius:clamp(10px,2.4vw,13px);min-width:0}

  .tip{font-size:clamp(10px,2.1vw,12px);margin:clamp(10px,2.2vw,18px) 0 clamp(76px,18vw,96px);line-height:1.75}
  .eq{font-size:clamp(10px,2.1vw,11.5px);padding:clamp(8px,2vw,12px) clamp(10px,2.4vw,14px);line-height:1.8}
  .tabbar{padding:clamp(4px,1vw,6px) clamp(6px,1.6vw,10px) calc(clamp(4px,1vw,6px) + env(safe-area-inset-bottom))}
  .tabbar button{font-size:clamp(9px,1.9vw,11px);gap:0}
  .tabbar button i{font-size:clamp(15px,3.4vw,19px)}
  .toast{bottom:clamp(76px,19vw,96px);font-size:clamp(11.5px,2.4vw,13.5px);padding:clamp(8px,1.8vw,10px) clamp(14px,3.4vw,19px)}


  /* ============================================================
   CVA 描述性评估（SCA 咖啡价值评估 2024 第二版）
   - 每个区段一条 0–15 强度滑杆（input[type=range]）+ 数值显示
   - 滑杆可横向拖曳微调；点击数值可切换 1 的步距
   - 香气 / 风味属性用 CATA 勾选框，可依附件表格独立勾选
   ============================================================ */
  .desc-card{margin-top:10px}
  .desc-card .sec-t{justify-content:space-between;gap:8px}
  .desc-card .sec-t .hint{font-size:9.5px;font-weight:600;color:var(--bean-l);letter-spacing:0;white-space:nowrap}
  .dsec{margin:0 -3px;padding:11px 3px;border-bottom:1px dashed var(--line)}
  .dsec:last-child{border-bottom:none}
  .dsec .dt{display:flex;align-items:baseline;gap:6px;margin-bottom:7px;flex-wrap:wrap}
  .dsec .dt .zh{font-size:12.5px;font-weight:800;color:var(--bean)}
  .dsec .dt .en{font-size:9px;color:var(--sub);letter-spacing:.2px}
  /* 强度滑杆：0–15 共 16 阶，可拖曳 */
  .int{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .int label.int-lb{flex:1 1 auto;min-width:0;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.6px}
  .int .rail{position:relative;flex:1 1 auto;min-width:0;padding:3px 0;margin-right:2px}
  .int .rail::after{content:"";position:absolute;left:0;right:0;top:50%;height:7px;transform:translateY(-50%);
      background:repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px calc(100%/15));
      border-radius:7px;pointer-events:none;opacity:.45}
  .int input[type=range]{position:relative;z-index:2}
  .int input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;margin:0;background:transparent;cursor:pointer}
  .int input[type=range]:focus{outline:none}
  .int input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:7px;background:var(--faint)}
  .int input[type=range]::-moz-range-track{height:7px;border-radius:7px;background:var(--faint)}
  .int .rail::before{content:"";position:absolute;left:0;top:50%;height:7px;transform:translateY(-50%);
      width:var(--fill,0%);background:linear-gradient(90deg,var(--bean),var(--bean-l));
      border-radius:7px;pointer-events:none;z-index:1;transition:width .12s linear}
  .int input[type=range]::-moz-range-track{height:7px;border-radius:7px;background:var(--faint)}
  .int input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
      background:#fff;border:2.5px solid var(--bean);margin-top:-6px;box-shadow:0 2px 5px rgba(111,92,63,.3);
      transition:transform .12s}
  .int input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:#fff;
      border:2.5px solid var(--bean);box-shadow:0 2px 5px rgba(111,92,63,.3)}
  .int input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
  .int .val{width:42px;height:26px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);
      color:var(--bean);font-size:12.5px;font-weight:800;font-family:inherit;text-align:center;line-height:24px;
      cursor:pointer;flex:none;font-variant-numeric:tabular-nums}
  .int .val.zero{color:var(--faint)}
  /* 低 / 中 / 高 三段标记 */
  .int ticks{display:flex;justify-content:space-between;font-size:8px;color:var(--faint);
      letter-spacing:.4px;margin:-4px 0 6px;padding:0 calc(21px + 9px)}
  /* CATA 勾选网格：3 列，贴合附件表格栏位密度 */
  .cata{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px}
  .cata.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cata label{display:flex;align-items:center;gap:4px;font-size:9.6px;color:var(--ink);line-height:1.25;
      cursor:pointer;padding:2px 1px;min-height:0}
  .cata label input{width:12px;height:12px;accent-color:var(--bean);flex:none;margin:0;cursor:pointer}
  .cata.mf{grid-template-columns:1fr}
  .cata.mf label{font-size:10px;padding:3px 1px}
  /* ===== 综合评估区块化版面 ===== */
  .eval-card{margin-top:10px}
  .eval{margin:0 -3px 14px;padding:12px 9px 4px;border:1px solid var(--line);border-left:4px solid var(--bean);
         border-radius:13px;background:linear-gradient(180deg,#fffdf9,#fbf8f2);box-shadow:0 2px 9px rgba(111,92,63,.07)}
  .eval .big-t{font-size:clamp(13px,2.8vw,16px);color:var(--bean);letter-spacing:.6px;padding:0 2px 8px;
               border-bottom:2px solid var(--gold);margin-bottom:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .eval .big-t .en2{font-size:9px;font-weight:600;color:var(--bean-l);letter-spacing:.2px}
  .eval .subsec{margin-bottom:11px}
  .eval .sub-t{font-size:10.5px;color:var(--bean-l);letter-spacing:.9px;padding:0 0 6px}
  .eval .sub-t::before{background:var(--bean-l)}
  .eval .dsec{padding:9px 2px}
  .eval .emogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 14px}
  .eval .emo{display:flex;align-items:center;gap:9px;padding:6px 3px;border-bottom:1px dashed var(--line)}
  .eval .emo:last-child{border-bottom:none}
  .eval .emo .zh{font-size:12.5px}
  .eval .emo .en{font-size:9px}  .cata.mf label .sub2{color:var(--sub);font-size:8.6px;margin-left:2px;font-weight:400}
  /* 记录页 */
  .rec-head{padding:clamp(4px,1vw,8px) 2px clamp(2px,.6vw,5px);gap:clamp(8px,2vw,14px)}
  .rec-head .t{font-size:clamp(11px,2.3vw,13px)}
  .rec-head .c,.empty{font-size:clamp(10.5px,2.1vw,12px)}
  th,td{padding:clamp(5px,1.1vw,7px) clamp(1px,.5vw,3px);font-size:clamp(9.5px,1.9vw,11.5px)}
  th{font-size:clamp(8.5px,1.7vw,10px)}
  td.cupcell{font-size:clamp(11px,2.3vw,12.5px)}
  td.sc{font-size:clamp(11.5px,2.4vw,13px)}
  td.del{font-size:clamp(13px,2.6vw,15px)}

  /* 语言选择器 */
  .langbox{margin-left:auto}
  .langbox select{font-family:inherit;font-size:clamp(10.5px,2.1vw,12px);font-weight:700;
    color:var(--bean);background:rgba(255,255,255,.22);border:1.3px solid rgba(255,255,255,.45);
    border-radius:clamp(8px,1.8vw,11px);padding:clamp(3px,.8vw,5px) clamp(6px,1.4vw,9px);
    -webkit-appearance:none;appearance:none;cursor:pointer}
  .langbox select:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.34)}

  /* ============================================================
   字级手动缩放（Ａ＋／Ａ－）：作用在 body.fs-zoom 上
   ============================================================ */
  body.fs-zoom{font-size:calc(100% * var(--fs-scale))}
  body.fs-zoom header h1{font-size:calc(clamp(15.5px,3.4vw,25px) * var(--fs-scale))}
  body.fs-zoom header .sub{font-size:calc(clamp(10px,2.2vw,13px) * var(--fs-scale))}
  body.fs-zoom .big{font-size:calc(clamp(30px,7.4vw,58px) * var(--fs-scale))}
  body.fs-zoom .big u{font-size:calc(clamp(11px,2.4vw,16px) * var(--fs-scale))}
  body.fs-zoom .verd{font-size:calc(clamp(10.5px,2.3vw,14px) * var(--fs-scale))}
  body.fs-zoom .sec-t{font-size:calc(clamp(11px,2.3vw,13.5px) * var(--fs-scale))}
  body.fs-zoom .name .zh{font-size:calc(clamp(12.5px,2.7vw,16.5px) * var(--fs-scale))}
  body.fs-zoom .name .en{font-size:calc(clamp(9px,1.9vw,11.5px) * var(--fs-scale))}
  body.fs-zoom .pick button{font-size:calc(clamp(12px,3vw,19px) * var(--fs-scale))}
  body.fs-zoom .btns button{font-size:calc(clamp(11.5px,2.5vw,14.5px) * var(--fs-scale))}
  body.fs-zoom .tip{font-size:calc(clamp(10px,2.1vw,12px) * var(--fs-scale))}
  body.fs-zoom .explain{font-size:calc(10.5px * var(--fs-scale))}
  body.fs-zoom .cr{font-size:calc(9.5px * var(--fs-scale))}
  body.fs-zoom .eq{font-size:calc(clamp(10px,2.1vw,11.5px) * var(--fs-scale))}
  body.fs-zoom .tabbar__btns button{font-size:calc(clamp(9px,1.9vw,11px) * var(--fs-scale))}
  body.fs-zoom .toast{font-size:calc(clamp(11.5px,2.4vw,13.5px) * var(--fs-scale))}
  body.fs-zoom .rec-head .t{font-size:calc(clamp(11px,2.3vw,13px) * var(--fs-scale))}
  body.fs-zoom .rec-head .c,.empty{font-size:calc(clamp(10.5px,2.1vw,12px) * var(--fs-scale))}
  body.fs-zoom th,body.fs-zoom td{font-size:calc(clamp(9.5px,1.9vw,11.5px) * var(--fs-scale))}
  body.fs-zoom th{font-size:calc(clamp(8.5px,1.7vw,10px) * var(--fs-scale))}
  body.fs-zoom td.cupcell{font-size:calc(clamp(11px,2.3vw,12.5px) * var(--fs-scale))}
  body.fs-zoom td.sc{font-size:calc(clamp(11.5px,2.4vw,13px) * var(--fs-scale))}

  /* Ａ＋／Ａ－ 字级调整钮 */
  .fsbox{display:flex;gap:5px;margin-left:auto;align-items:center}
  .fsbox button{width:clamp(26px,5.4vw,34px);height:clamp(26px,5.4vw,34px);border:1.5px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.16);color:#fff;font-family:inherit;font-weight:800;border-radius:9px;
    font-size:clamp(13px,2.6vw,17px);line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .fsbox button:active{transform:scale(.9);background:rgba(255,255,255,.34)}
  .fsbox button b{font-weight:800}

  /* ============================================================
   横向模式（手机横过来）：评分项左右双栏，按钮放大更好按
   侦测条件：landscape + 视窗宽高比 > 1.2（典型手机横向）
   ============================================================ */
  @media (orientation:landscape) and (max-height:520px){
    body{padding-bottom:56px}
    /* header 压扁一点 */
    header{padding:8px 14px}
    header h1{font-size:clamp(15px,3vw,20px)}
    .headrow{margin-top:5px}
    .big{font-size:clamp(28px,6vw,44px)}
    .bar{margin-top:6px}
    /* 双栏：8 项评分切成左右两栏 */
    #items{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
    .row{flex-wrap:nowrap;gap:8px;padding:7px 4px}
    /* 数字按钮放大 */
    .pick button{width:clamp(34px,8vw,52px);height:clamp(38px,9vw,56px);font-size:clamp(15px,3.6vw,21px);border-radius:11px}
    /* 操作钮一排摊开 */
    .btns button{flex:1 1 auto;min-width:0;padding:11px 6px;font-size:clamp(11.5px,2.4vw,13.5px)}
    /* 计算逻辑卡片与 tip 缩小间距 */
    .tip{margin-bottom:clamp(70px,16vw,92px)}
    /* 记录页表格在手机横向也让每列更宽松 */
    .recbox table{min-width:clamp(480px,88vw,900px)}
  }

  /* ===== 笔记栏（新增，不影响任何既有评分／版型规则） ===== */
  .notebox{margin:7px 0 2px}
  .notebox textarea{font-family:inherit;font-size:11.5px;font-weight:500;color:var(--ink);
    width:100%;min-height:26px;max-height:126px;height:26px;resize:none;overflow:hidden;
    padding:6px 9px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);
    box-sizing:border-box;line-height:1.55;display:block;transition:border-color .15s,background .15s,height .12s}
  .notebox textarea::placeholder{color:#b6a892;font-weight:400}
  .notebox textarea:focus{outline:none;border-color:var(--gold);background:#fff;
    box-shadow:0 0 0 3px rgba(192,154,90,.16)}
  .notebox textarea.has{color:var(--bean);font-weight:600}
  /* 笔记列跟随流体缩放 */
  body.fs-zoom .notebox textarea{font-size:calc(clamp(11px,2.3vw,12.5px) * var(--fs-scale))}
  /* 记录表笔记列 */
  th.nt,td.nt{font-size:8.4px;color:#a08a6e;font-weight:600;max-width:150px;min-width:88px;
    white-space:normal;line-height:1.35;word-break:break-word;background:#fbf8f2;
    border-left:1px dashed var(--line);border-right:1px dashed var(--line)}
  td.nt{font-size:9.4px;font-weight:400;color:var(--ink);text-align:left;padding:6px 6px}
  td.nt:empty::after{content:"—";color:var(--faint)}
  body.fs-zoom th.nt{font-size:calc(8.4px * var(--fs-scale))}
  body.fs-zoom td.nt{font-size:calc(9.4px * var(--fs-scale))}
</style>
</head>
<body>

<div class="slist" id="slist"></div>
<div class="scur" id="scur"></div>
<div class="mask" id="mask">
  <div class="dlg">
    <h3>设定本次杯测样品</h3>
    <div class="ds">输入本次要杯测的样品数量，系统会为每个样品建立独立的评分页，左侧（手机为底部）可快速切换。</div>
    <label class="t">样品数量</label>
    <input type="number" id="setupN" min="1" max="24" value="3" inputmode="numeric">
    <div class="err" id="setupErr">请输入 1–24 之间的数字</div>
    <div class="hint">最少 1 个，最多 24 个；切换后目前样品的评分会自动暂存。</div>
    <div class="acts">
      <button class="no" onclick="closeSetup()">取消</button>
      <button class="ok" onclick="applySetup()">确定</button>
    </div>
  </div>
</div>
<header>
  <div class="headtop">
    <h1>CVA 综合评估<span class="ver" id="buildVer"></span></h1>
    <button class="setbtn" id="setupBtn" onclick="openSetup()">⚙ 设定样品</button>
  </div>
  <div class="topbar">
    <div class="ti"><label>杯测日期 <i>DATE</i></label><input type="date" id="cupped"></div>
    <div class="ti"><label>填表人员 <i>Cupper</i></label><input type="text" id="cupper" placeholder="请输入杯测师姓名" autocomplete="off"></div>
  </div>
  <div class="meta">
